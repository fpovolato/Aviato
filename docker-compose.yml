services:
  backend:
    build: ./backend
    ports:
      - "3000:3000" # se passi in HTTPS da Nginx esterno, qui puoi anche omettere
      - "3443:3443" # HTTPS backend
    volumes:
      - ./certs:/app/certs:ro # monta i certificati
    environment:
      - MONGO_URI=mongodb://mongo:27017/backenddb
      - PORT=3443 # cambia porta interna per HTTPS
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  dashboard:
    build: ./dashboard
    ports:
      - "4200:80" # opzionale: mantiene dev HTTP
      - "4443:443" # HTTPS dashboard
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  site:
    build: ./site
    image: aviato-site
    ports:
      - "4300:80" # opzionale: mantiene dev HTTP
      - "4543:443" # HTTPS site
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  mongo-data:
