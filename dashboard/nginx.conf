server {
  listen       80;
  server_name  _;

  # radice della tua app
  root   /usr/share/nginx/html/browser;
  index  index.html index.htm;

  # regola SPA: se non trova file o cartella, torna a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # disabilita caching di index.html per evitare vecchie versioni
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # caching per asset pesanti (CSS/JS/font/... etc.)
  location ~* \.(?:css|js|json|html?|xml|txt)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}